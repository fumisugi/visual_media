[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-media-yoloworld"
version = "0.1.0"
description = "Reproducible YOLO-World failure-case analysis on COCO 2017 val"
requires-python = ">=3.10,<3.12"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "Pillow",
  "pycocotools",
  "PyYAML",
  "seaborn",
  "torch",
  "torchvision",
  "ultralytics",
  "clip @ git+https://github.com/ultralytics/CLIP.git@c4b6ea0932a2c0f39a0fa528af5ec4982ff15cab",
]

[project.scripts]
yoloworld-experiment = "yolo_world_experiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
