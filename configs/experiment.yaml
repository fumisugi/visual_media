    - {name: wiener_k0.010_b1.00, method: wiener, regularization: 0.010, blend: 1.00}

prompt_prototype_improvement:
  anchor_weights: [0.25, 0.50, 0.75]
  screening_candidates_to_keep: 2
  target_conditions: [synonym, hypernym]
  minimum_mean_f1_gain: 0.05
  minimum_fold_gain: 0.00
  maximum_canonical_f1_drop: 0.01
  maximum_mean_map_drop: 0.01
  final_holdout_min_box_area: 256
  final_holdout_quotas: {car: 31, couch: 32, airplane: 5, cup: 32}

evaluation:
  confidence: 0.25
  match_iou: 0.50
  tune_confidences: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50]
  tune_nms_ious: [0.40, 0.50, 0.60]
  bootstrap_samples: 2000

pilot_gate:
  minimum_baseline_recall: 0.50
  minimum_absolute_f1_change: 0.15

improvement:
  lowlight_brightness: 0.25
  gamma_candidates: [0.40, 0.50, 0.60, 0.70]

prompt_improvement:
  variants:
    photo_template: "a photo of {article} {category}"
    scene_template: "{article} {category} in the image"
    plural:
      car: cars
      couch: couches
      airplane: airplanes
      cup: cups
  agreement_bonus_candidates: [0.00, 0.05, 0.10]

categories:
  car:
    coco_id: 3
    prompts: [car, automobile, motor vehicle]
    quota: 25
  couch:
    coco_id: 63
    prompts: [couch, sofa, seating furniture]
    quota: 25
  airplane:
    coco_id: 5
    prompts: [airplane, aircraft, flying vehicle]
    quota: 25
  cup:
    coco_id: 47
    prompts: [cup, mug, drinking container]
    quota: 25

corruptions:
  - name: original
    type: identity
    value: 1.0
  - name: brightness_0.50
    type: brightness
    value: 0.50
  - name: brightness_0.25
    type: brightness
    value: 0.25
  - name: blur_sigma_2
    type: gaussian_blur
    value: 2.0
  - name: blur_sigma_4
    type: gaussian_blur
    value: 4.0
