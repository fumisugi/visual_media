  blur_candidates:
    - {name: unsharp_r0.5_a1.5, method: unsharp, radius_factor: 0.5, amount: 1.5}
    - {name: unsharp_r0.5_a3.0, method: unsharp, radius_factor: 0.5, amount: 3.0}
