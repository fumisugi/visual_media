  holdout_images: 100
  holdout_seed: 20260731
  final_holdout_seed: 20260801
  same_model_holdout_seed: 20260802
  prompt_prototype_holdout_seed: 20260803

clear_improvement:
  scale_model: yolov8m-worldv2.pt
  scale_image_sizes: [640, 768]
  scale_simplicity_tolerance: 0.01
  image_sizes: [768, 960, 1280]
  confidence_candidates: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.50]
  nms_iou_candidates: [0.40, 0.50, 0.60, 0.70]
  prompt_sets:
    canonical: [car, couch, airplane, cup]
    robust_category: [car, couch, aircraft, cup]
  use_horizontal_flip: [false, true]
  minimum_f1_gain: 0.03
  maximum_map_drop: 0.01
  support_iou_candidates: [0.40, 0.50, 0.60]
  support_bonus_candidates: [0.00, 0.025, 0.05, 0.075, 0.10]
  supplement_weight_candidates: [0.50, 0.70, 0.90]
  supplement_min_support_candidates: [1, 2]
  supplement_cluster_iou_candidates: [0.40, 0.50, 0.60]

same_model_improvement:
