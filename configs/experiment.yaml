    - {name: unsharp_r1.0_a4.5, method: unsharp, radius_factor: 1.0, amount: 4.5}
    - {name: unsharp_r1.5_a1.5, method: unsharp, radius_factor: 1.5, amount: 1.5}
    - {name: unsharp_r1.5_a3.0, method: unsharp, radius_factor: 1.5, amount: 3.0}
    - {name: unsharp_r1.5_a4.5, method: unsharp, radius_factor: 1.5, amount: 4.5}
    - {name: wiener_k0.001_b0.75, method: wiener, regularization: 0.001, blend: 0.75}
    - {name: wiener_k0.003_b0.75, method: wiener, regularization: 0.003, blend: 0.75}
    - {name: wiener_k0.010_b0.75, method: wiener, regularization: 0.010, blend: 0.75}
